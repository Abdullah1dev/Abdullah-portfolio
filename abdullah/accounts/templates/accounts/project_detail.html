<!DOCTYPE html>
<html>
<head>
  <title>{{ project.title }}</title>
</head>
<body>
  <h1>{{ project.title }}</h1>
  <img src="{{ project.image.url }}" alt="{{ project.title }}" style="width:300px;">
  <p>{{ project.description }}</p>

  <h3>Tags:</h3>
  <ul>
    {% for tag in project.tags.all %}
      <li>{{ tag.name }}</li>
    {% endfor %}
  </ul>

  <h3>Gallery:</h3>
  <div>
    {% for img in project.images.all %}
      <img src="{{ img.image.url }}" alt="{{ img.caption }}" style="width:200px;">
    {% endfor %}
  </div>

  <p><a href="{{ project.demo_link }}">Demo</a> | <a href="{{ project.github_link }}">GitHub</a></p>
</body>
</html>
