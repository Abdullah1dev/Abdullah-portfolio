{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Abdullah Portfolio - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* 🌈 General Styles */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      text-shadow: 0px 3px 8px rgba(0,0,0,0.2);
    }

    p {
      margin: 0.8rem 0;
    }

    /* 🌟 Buttons */
    a {
      display: inline-block;
      text-decoration: none;
      color: white;
      background-color: rgba(255,255,255,0.15);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.3);
    }

    a:hover {
      background-color: white;
      color: #007bff;
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(255,255,255,0.3);
    }

    /* 🌐 Footer */
    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    /* 📱 Responsive Design */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      a {
        font-size: 0.9rem;
        padding: 0.6rem 1.2rem;
      }
    }

    /* ✨ Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body, h1, a {
      animation: fadeIn 1.2s ease forwards;
    }
  </style>
</head>

<body>
  <h1>Welcome to Abdullah Portfolio</h1>
  <p><a href="{% url 'project_list' %}">View All Projects</a></p>
  <p><a href="{% url 'create_project' %}">Add New Project</a></p>

  <footer>© {{ now|date:"Y" }} Abdullah Tahir — All Rights Reserved</footer>
</body>
</html>
