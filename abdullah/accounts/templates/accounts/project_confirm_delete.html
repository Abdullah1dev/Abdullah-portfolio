<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Project</title>
</head>
<body>
  <h1>Are you sure you want to delete "{{ project.title }}"?</h1>

  <form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'project_list' %}">Cancel</a>
  </form>
</body>
</html>
